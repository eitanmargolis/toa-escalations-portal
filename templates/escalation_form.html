{% extends "base.html" %}
{% block title %}Create an Escalation{% endblock %}
{% block content %}
<h1>Create an Escalation</h1>
<form method="post" class="card" enctype="multipart/form-data">
  <input type="hidden" name="form_token" value="{{ form_token }}">
  <div class="section-header">Information</div>
  <div class="form-grid">
    <div>
      <label>Type *</label>
      <select name="type" id="typeField" required>
        <option value="">-- Select --</option>
        {% for t in types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
      </select>
    </div>
    <div id="subtypeWrapper" style="display:none;">
      <label>Subtype *</label>
      <select name="subtype" id="subtypeField">
        <option value="">-- Select --</option>
      </select>
    </div>
    <div>
      <label>Candidate *</label>
      <input type="text" name="candidate" required>
    </div>
    <div>
      <label>Facility *</label>
      <input type="text" name="facility" required>
    </div>
    <div class="full">
      <label>Assignment URL *</label>
      <input type="url" name="assignment_url" required>
    </div>
    <div id="discussedWrapper">
      <label>Discussed with Coast Manager?<span id="discussedRequiredMark"> *</span></label>
      <select name="discussed_with_manager" id="discussedField" required>
        <option value="">-- Select --</option>
        {% for v in yes_no %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div id="clinicalCallWrapper">
      <label>Clinical Call Required</label>
      <select name="clinical_call_required">
        <option value="">-- Select --</option>
        {% for v in yes_no %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
      </select>
    </div>
  </div>

  <div class="section-header">Related Users</div>
  <div class="form-grid">
    <div>
      <label>Recruiter *</label>
      <select name="recruiter_id" required>
        <option value="">-- Select --</option>
        {% for u in recruiters %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
      </select>
    </div>
    <div id="salesRepWrapper">
      <label>Sales Rep<span id="salesRepRequiredMark"> *</span></label>
      <select name="sales_rep_id" id="salesRepField" required>
        <option value="">-- Select --</option>
        {% for u in sales_reps %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
      </select>
    </div>
    <div id="acWrapper">
      <label>AC</label>
      <select name="ac_id" id="acField">
        <option value="">-- Auto-assigned from Sales Rep --</option>
        {% for u in acs %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
      </select>
    </div>
    <div id="complianceWrapper">
      <label>Compliance Specialist<span id="complianceRequiredMark"> *</span></label>
      <select name="compliance_specialist_id" id="complianceField">
        <option value="">-- Select --</option>
        {% for u in compliance_specialists %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
      </select>
    </div>
    <div id="complianceManagerWrapper" style="display:none;">
      <label>Compliance Manager</label>
      <input type="text" disabled placeholder="Auto-set from Compliance Specialist's manager on save">
    </div>
    <div>
      <label>Recruiter Manager</label>
      <input type="text" disabled placeholder="Auto-set from Recruiter's manager on save">
    </div>
    <div id="payrollSpecialistWrapper" style="display:none;">
      <label>Payroll Specialist</label>
      <select name="payroll_specialist_id" id="payrollSpecialistField">
        <option value="">-- Auto-assigned to Payroll Team --</option>
        {% for u in payroll_specialists %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
      </select>
    </div>
    <div id="payrollSpecialistAssignedWrapper" style="display:none;">
      <label>Payroll Specialist Assigned</label>
      <input type="text" name="payroll_specialist_assigned" placeholder="Name of the person on the Payroll Team handling this">
    </div>
    <div id="clinicalLiaisonWrapper" style="display:none;">
      <label>Clinical Liaison</label>
      <select name="clinical_liaison_id" id="clinicalLiaisonField">
        <option value="">-- Auto-assigned to Lauren Redig --</option>
        {% for u in clinical_liaisons %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
      </select>
    </div>
  </div>

  <div class="section-header">Escalation Detail</div>
  <div class="form-grid">
    <div class="full">
      <label>Details/What Happened? *</label>
      <div class="richtext-editor" id="detailsEditor" contenteditable="true" data-placeholder="Describe what happened..."></div>
      <textarea name="details" id="detailsHidden" required class="richtext-sync-field"></textarea>
    </div>
    <div>
      <label>Action To</label>
      <select name="action_to_id">
        <option value="">-- Select --</option>
        {% for u in all_users %}<option value="{{ u.id }}">{{ u.full_name }}{{ ' (Me)' if u.id==current_user.id }}</option>{% endfor %}
      </select>
    </div>
    <div id="dangerWrapper">
      <label>Danger of Cancelling?</label>
      <select name="danger_of_cancelling">
        <option value="">-- Select --</option>
        {% for v in yes_no %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div class="full">
      <label>Action Item</label>
      <textarea name="action_item"></textarea>
    </div>
    <div id="escalatedWrapper">
      <label><input type="checkbox" name="escalated_to_client" style="width:auto;"> Escalated to Client</label>
    </div>
    <div id="bestDayWrapper">
      <label>Best Day to Call Traveler</label>
      <input type="date" name="best_day_to_call">
    </div>
    <div id="bestTimeWrapper">
      <label>Best Time to Call Traveler</label>
      <select name="best_time_to_call">
        <option value="">-- Select --</option>
        {% for v in best_times %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div id="timeZoneWrapper">
      <label>Time Zone</label>
      <select name="time_zone">
        <option value="">-- Select --</option>
        {% for v in time_zones %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
      </select>
    </div>

    <div id="coastDeadlineWrapper" style="display:none;">
      <label>Coast Deadline<span> *</span></label>
      <input type="date" name="coast_deadline" id="coastDeadlineField">
    </div>
    <div id="facilityDeadlineWrapper" style="display:none;">
      <label>Facility Deadline<span> *</span></label>
      <input type="date" name="facility_deadline" id="facilityDeadlineField">
    </div>
    <div id="pushedStartWrapper" style="display:none;">
      <label><input type="checkbox" name="pushed_start" id="pushedStartCheck" style="width:auto;"> Pushed Start?</label>
    </div>
    <div id="pushedStartNotesWrapper" style="display:none;">
      <label>Pushed Start Notes</label>
      <textarea name="pushed_start_notes"></textarea>
    </div>

    <div id="weDateWrapper" style="display:none;">
      <label>WE Date<span> *</span></label>
      <input type="date" name="we_date" id="weDateField">
    </div>

    <div class="full">
      <label>Attach Documents</label>
      <input type="file" name="attachments" multiple>
    </div>
  </div>

  <div class="section-header">Resolution</div>
  <div class="form-grid">
    <div id="dateToBePaidWrapper" style="display:none;">
      <label>Date to be paid</label>
      <input type="date" name="date_to_be_paid">
    </div>
    <div id="dnrFacilityWrapper" style="display:none;">
      <label><input type="checkbox" name="dnr_facility" id="dnrFacilityCheck" style="width:auto;"> DNR Facility</label>
    </div>
    <div id="dnrFacilityNotesWrapper" style="display:none;">
      <label>DNR Facility Notes<span id="dnrFacilityRequiredMark"> *</span></label>
      <textarea name="dnr_facility_notes"></textarea>
    </div>
    <div id="dnrMspWrapper" style="display:none;">
      <label><input type="checkbox" name="dnr_msp" id="dnrMspCheck" style="width:auto;"> DNR MSP</label>
    </div>
    <div id="dnrMspNotesWrapper" style="display:none;">
      <label>DNR MSP Notes<span id="dnrMspRequiredMark"> *</span></label>
      <textarea name="dnr_msp_notes"></textarea>
    </div>
    <div id="dnrHospitalWrapper" style="display:none;">
      <label><input type="checkbox" name="dnr_hospital_system" id="dnrHospitalCheck" style="width:auto;"> DNR Hospital System</label>
    </div>
    <div id="dnrHospitalNotesWrapper" style="display:none;">
      <label>DNR Hospital System Notes<span id="dnrHospitalRequiredMark"> *</span></label>
      <textarea name="dnr_hospital_system_notes"></textarea>
    </div>
  </div>

  <p style="margin-top:20px;">
    <button class="btn" type="submit">Create Escalation</button>
  </p>
</form>

<script>
const SUBTYPES_BY_TYPE = {{ subtypes_by_type|tojson }};
const CLINICAL_TYPES = {{ clinical_types|tojson }};
const SALES_REP_AC_MAP = {{ sales_rep_ac_map|tojson }};
const TYPE_COMPLIANCE = "Compliance & Credentialing";
const TYPE_PAYROLL = "Payroll & Timekeeping";
const TYPE_CONTRACT = "Contract";
const TYPE_PRESTART = "Pre-Start";
const TYPE_PERSONAL = "Personal (On Assignment)";
const REQUIRED_SUBTYPE_TYPES = [TYPE_COMPLIANCE, TYPE_PAYROLL, TYPE_CONTRACT, TYPE_PRESTART, TYPE_PERSONAL];
const DISCUSSED_NOT_REQUIRED_TYPES = [TYPE_COMPLIANCE, TYPE_PAYROLL];
// Item 3 (this batch): Payroll & Timekeeping Subtypes for which Sales Rep/AC
// are removed from the page layout entirely. Must match SUBTYPES_BY_TYPE.
const PAYROLL_HIDE_SALES_REP_AC_SUBTYPES = ["Paycheck Error", "Late", "Reimbursements"];

const typeField = document.getElementById('typeField');
const subtypeWrapper = document.getElementById('subtypeWrapper');
const subtypeField = document.getElementById('subtypeField');
const complianceField = document.getElementById('complianceField');
const complianceRequiredMark = document.getElementById('complianceRequiredMark');
const complianceWrapper = document.getElementById('complianceWrapper');
const complianceManagerWrapper = document.getElementById('complianceManagerWrapper');
const payrollSpecialistWrapper = document.getElementById('payrollSpecialistWrapper');
const payrollSpecialistAssignedWrapper = document.getElementById('payrollSpecialistAssignedWrapper');
const clinicalLiaisonWrapper = document.getElementById('clinicalLiaisonWrapper');
const discussedField = document.getElementById('discussedField');
const discussedRequiredMark = document.getElementById('discussedRequiredMark');
const clinicalCallWrapper = document.getElementById('clinicalCallWrapper');
const dangerWrapper = document.getElementById('dangerWrapper');
const escalatedWrapper = document.getElementById('escalatedWrapper');
const bestDayWrapper = document.getElementById('bestDayWrapper');
const bestTimeWrapper = document.getElementById('bestTimeWrapper');
const timeZoneWrapper = document.getElementById('timeZoneWrapper');
const coastDeadlineWrapper = document.getElementById('coastDeadlineWrapper');
const coastDeadlineField = document.getElementById('coastDeadlineField');
const facilityDeadlineWrapper = document.getElementById('facilityDeadlineWrapper');
const facilityDeadlineField = document.getElementById('facilityDeadlineField');
const pushedStartWrapper = document.getElementById('pushedStartWrapper');
const pushedStartNotesWrapper = document.getElementById('pushedStartNotesWrapper');
const weDateWrapper = document.getElementById('weDateWrapper');
const weDateField = document.getElementById('weDateField');
const dateToBePaidWrapper = document.getElementById('dateToBePaidWrapper');
const dnrFacilityWrapper = document.getElementById('dnrFacilityWrapper');
const dnrFacilityNotesWrapper = document.getElementById('dnrFacilityNotesWrapper');
const dnrMspWrapper = document.getElementById('dnrMspWrapper');
const dnrMspNotesWrapper = document.getElementById('dnrMspNotesWrapper');
const dnrHospitalWrapper = document.getElementById('dnrHospitalWrapper');
const dnrHospitalNotesWrapper = document.getElementById('dnrHospitalNotesWrapper');
const salesRepField = document.getElementById('salesRepField');
const acField = document.getElementById('acField');
const salesRepWrapper = document.getElementById('salesRepWrapper');
const acWrapper = document.getElementById('acWrapper');
const salesRepRequiredMark = document.getElementById('salesRepRequiredMark');

function syncSubtype() {
  const type = typeField.value;
  const isClinical = CLINICAL_TYPES.includes(type);
  const isCompliance = type === TYPE_COMPLIANCE;
  const isPayroll = type === TYPE_PAYROLL;
  const isPrestart = type === TYPE_PRESTART;
  const isPersonal = type === TYPE_PERSONAL;
  // Clinical Liaison field + DNR checkboxes are shown for the two Clinical
  // types AND Personal (On Assignment).
  const isDnrLiaisonApplicable = isClinical || isPersonal;
  const subtypeRequired = isClinical || REQUIRED_SUBTYPE_TYPES.includes(type);
  if (subtypeRequired) {
    subtypeWrapper.style.display = '';
    subtypeField.required = true;
    const options = SUBTYPES_BY_TYPE[type] || [];
    subtypeWrapper.style.display = options.length ? '' : (isClinical ? '' : 'none');
    subtypeField.innerHTML = '<option value="">-- Select --</option>' + options.map(o => `<option value="${o}">${o}</option>`).join('');
  } else {
    subtypeWrapper.style.display = 'none';
    subtypeField.required = false;
    subtypeField.innerHTML = '<option value=""></option>';
  }

  // Compliance Specialist is removed from the page entirely for Clinical types
  // and Payroll & Timekeeping (item 4e); not required (but shown) otherwise.
  const complianceHidden = isClinical || isPayroll || type === TYPE_CONTRACT;
  if (complianceHidden) {
    complianceWrapper.style.display = 'none';
    complianceField.required = false;
    complianceField.value = '';
  } else {
    complianceWrapper.style.display = '';
    complianceField.required = true;
    complianceRequiredMark.style.display = '';
  }
  complianceManagerWrapper.style.display = (isCompliance || isPrestart) ? '' : 'none';

  // Payroll Specialist section (dropdown + free-text Assigned box) - item 7c
  syncPayrollVisibility();

  // Clinical Liaison field shown for Clinical types and Personal (On Assignment)
  clinicalLiaisonWrapper.style.display = isDnrLiaisonApplicable ? '' : 'none';

  // Discussed with Coast Manager - not required for Compliance & Credentialing / Payroll & Timekeeping
  const discussedRequired = !DISCUSSED_NOT_REQUIRED_TYPES.includes(type);
  discussedField.required = discussedRequired;
  discussedRequiredMark.style.display = discussedRequired ? '' : 'none';

  // Fields hidden entirely for Compliance & Credentialing (item 2c)
  clinicalCallWrapper.style.display = isCompliance ? 'none' : '';
  dangerWrapper.style.display = isCompliance ? 'none' : '';
  escalatedWrapper.style.display = isCompliance ? 'none' : '';
  bestDayWrapper.style.display = (isCompliance || isPayroll) ? 'none' : '';
  bestTimeWrapper.style.display = (isCompliance || isPayroll) ? 'none' : '';
  timeZoneWrapper.style.display = (isCompliance || isPayroll) ? 'none' : '';
  // Additionally hidden entirely for Payroll & Timekeeping (item 4e)
  if (isPayroll) clinicalCallWrapper.style.display = 'none';

  // Compliance & Credentialing detail fields (item 2e)
  coastDeadlineWrapper.style.display = isCompliance ? '' : 'none';
  coastDeadlineField.required = isCompliance;
  facilityDeadlineWrapper.style.display = isCompliance ? '' : 'none';
  facilityDeadlineField.required = isCompliance;
  pushedStartWrapper.style.display = isCompliance ? '' : 'none';
  pushedStartNotesWrapper.style.display = isCompliance ? '' : 'none';

  // Payroll & Timekeeping detail fields (item 4c)
  weDateWrapper.style.display = isPayroll ? '' : 'none';
  weDateField.required = isPayroll;
  dateToBePaidWrapper.style.display = isPayroll ? '' : 'none';

  // Sales Rep / AC (item 3): hidden + not required for Payroll & Timekeeping
  // with Subtype Paycheck Error / Late / Reimbursements only.
  syncSalesRepAcVisibility();

  // DNR fields (item 1) - Clinical types and Personal (On Assignment); the
  // *_notes wrapper additionally depends on whether its checkbox is
  // currently checked (handled in syncDnrVisibility).
  [dnrFacilityWrapper, dnrMspWrapper, dnrHospitalWrapper].forEach(w => {
    w.style.display = isDnrLiaisonApplicable ? '' : 'none';
  });
  syncDnrVisibility(isDnrLiaisonApplicable);
}

function syncDnrVisibility(isDnrApplicable) {
  const pairs = [
    [document.getElementById('dnrFacilityCheck'), dnrFacilityNotesWrapper, document.getElementById('dnrFacilityRequiredMark')],
    [document.getElementById('dnrMspCheck'), dnrMspNotesWrapper, document.getElementById('dnrMspRequiredMark')],
    [document.getElementById('dnrHospitalCheck'), dnrHospitalNotesWrapper, document.getElementById('dnrHospitalRequiredMark')],
  ];
  pairs.forEach(([check, notesWrapper, mark]) => {
    const show = isDnrApplicable && check.checked;
    notesWrapper.style.display = show ? '' : 'none';
    if (mark) mark.style.display = show ? '' : 'none';
  });
}
function syncPayrollVisibility() {
  const type = typeField.value;
  const isPayroll = type === TYPE_PAYROLL;
  const payrollApplicable = isPayroll || (type === TYPE_CONTRACT && subtypeField.value === 'Pay Changes');
  payrollSpecialistWrapper.style.display = payrollApplicable ? '' : 'none';
  payrollSpecialistAssignedWrapper.style.display = payrollApplicable ? '' : 'none';
}

// Item 3 (this batch): Sales Rep + AC removed from the page layout for
// Payroll & Timekeeping with Subtype Paycheck Error / Late / Reimbursements.
// Depends on both Type and Subtype, so it's re-run on changes to either.
function syncSalesRepAcVisibility() {
  const type = typeField.value;
  const hide = type === TYPE_PAYROLL && PAYROLL_HIDE_SALES_REP_AC_SUBTYPES.includes(subtypeField.value);
  salesRepWrapper.style.display = hide ? 'none' : '';
  acWrapper.style.display = hide ? 'none' : '';
  salesRepField.required = !hide;
  if (salesRepRequiredMark) salesRepRequiredMark.style.display = hide ? 'none' : '';
  if (hide) salesRepField.value = '';
}

typeField.addEventListener('change', syncSubtype);
// Subtype changes never rebuild the Subtype dropdown itself (that would wipe
// out the selection the user just made) - only the Payroll Specialist and
// Sales Rep/AC visibility depend on the live Subtype value.
subtypeField.addEventListener('change', function() {
  syncPayrollVisibility();
  syncSalesRepAcVisibility();
});
syncSubtype();

// Sales Rep -> ACs field (item 10c): auto-fill AC live from a JSON map, client-side
salesRepField.addEventListener('change', function() {
  const acId = SALES_REP_AC_MAP[salesRepField.value];
  acField.value = acId ? String(acId) : '';
});

// DNR checkbox -> conditionally-required notes field (item 1)
['dnrFacilityCheck', 'dnrMspCheck', 'dnrHospitalCheck'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => syncDnrVisibility(CLINICAL_TYPES.includes(typeField.value) || typeField.value === TYPE_PERSONAL));
});

// --- Rich text editor (contenteditable) sync for Details/What Happened ---
// Bullet lists and paragraph breaks pasted from Word/Docs/etc. are preserved
// by the browser's native contenteditable paste handling; we just need to
// keep the hidden textarea (the field actually submitted/validated) in sync.
const detailsEditor = document.getElementById('detailsEditor');
const detailsHidden = document.getElementById('detailsHidden');
const detailsForm = detailsEditor.closest('form');

function syncDetailsHidden() {
  detailsHidden.value = detailsEditor.innerHTML.trim();
}
detailsEditor.addEventListener('input', syncDetailsHidden);
detailsEditor.addEventListener('blur', syncDetailsHidden);
detailsForm.addEventListener('submit', syncDetailsHidden);

// Prevent duplicate escalations from a double-click / repeated Enter/click
// on Create Escalation while the request is in flight. The 'submit' event
// only fires after the browser's own required-field validation has already
// passed, so disabling the button here never blocks a legitimate first
// submission - it only stops a second one from firing before the page
// navigates away. If validation fails server-side, the page fully re-renders
// (see new_escalation() in app.py), which naturally resets the button.
detailsForm.addEventListener('submit', function() {
  const submitBtn = detailsForm.querySelector('button[type="submit"]');
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating...';
  }
});
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Create an Escalation{% endblock %}
{% block content %}
<h1>Create an Escalation</h1>
<form method="post" class="card" enctype="multipart/form-data">
  <div class="section-header">Information</div>
  <div class="form-grid">
    <div>
      <label>Type *</label>
      <select name="type" id="typeField" required>
        <option value="">-- Select --</option>
        {% for t in types %}<option value="{{ t }}">{{ t }}</option>{% endfor %}
      </select>
    </div>
    <div id="subtypeWrapper" style="display:none;">
      <label>Subtype *</label>
      <select name="subtype" id="subtypeField">
        <option value="">-- Select --</option>
      </select>
    </div>
    <div>
      <label>Candidate *</label>
      <input type="text" name="candidate" required>
    </div>
    <div>
      <label>Facility *</label>
      <input type="text" name="facility" required>
    </div>
    <div class="full">
      <label>Assignment URL *</label>
      <input type="url" name="assignment_url" required>
    </div>
    <div>
      <label>Discussed with Coast Manager? *</label>
      <select name="discussed_with_manager" required>
        <option value="">-- Select --</option>
        {% for v in yes_no %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label>Clinical Call Required</label>
      <select name="clinical_call_required">
        <option value="">-- Select --</option>
        {% for v in yes_no %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
      </select>
    </div>
  </div>

  <div class="section-header">Related Users</div>
  <div class="form-grid">
    <div>
      <label>Recruiter *</label>
      <select name="recruiter_id" required>
        <option value="">-- Select --</option>
        {% for u in recruiters %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label>Sales Rep *</label>
      <select name="sales_rep_id" required>
        <option value="">-- Select --</option>
        {% for u in sales_reps %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label>Compliance Specialist<span id="complianceRequiredMark"> *</span></label>
      <select name="compliance_specialist_id" id="complianceField">
        <option value="">-- Select --</option>
        {% for u in compliance_specialists %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label>Recruiter Manager</label>
      <input type="text" disabled placeholder="Auto-set from Recruiter's manager on save">
    </div>
    <div id="payrollSpecialistWrapper" style="display:none;">
      <label>Payroll Specialist</label>
      <select name="payroll_specialist_id" id="payrollSpecialistField">
        <option value="">-- Auto-assigned to Payroll Team --</option>
        {% for u in payroll_specialists %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
      </select>
    </div>
    <div id="clinicalLiaisonWrapper" style="display:none;">
      <label>Clinical Liaison</label>
      <select name="clinical_liaison_id" id="clinicalLiaisonField">
        <option value="">-- Auto-assigned to Lauren Redig --</option>
        {% for u in clinical_liaisons %}<option value="{{ u.id }}">{{ u.full_name }}</option>{% endfor %}
      </select>
    </div>
  </div>

  <div class="section-header">Escalation Detail</div>
  <div class="form-grid">
    <div class="full">
      <label>Details/What Happened? *</label>
      <div class="richtext-editor" id="detailsEditor" contenteditable="true" data-placeholder="Describe what happened..."></div>
      <textarea name="details" id="detailsHidden" required class="richtext-sync-field"></textarea>
    </div>
    <div>
      <label>Action To</label>
      <select name="action_to_id">
        <option value="">-- Select --</option>
        {% for u in all_users %}<option value="{{ u.id }}">{{ u.full_name }}{{ ' (Me)' if u.id==current_user.id }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label>Danger of Cancelling?</label>
      <select name="danger_of_cancelling">
        <option value="">-- Select --</option>
        {% for v in yes_no %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div class="full">
      <label>Action Item</label>
      <textarea name="action_item"></textarea>
    </div>
    <div>
      <label><input type="checkbox" name="escalated_to_client" style="width:auto;"> Escalated to Client</label>
    </div>
    <div>
      <label>Best Day to Call Traveler</label>
      <input type="date" name="best_day_to_call">
    </div>
    <div>
      <label>Best Time to Call Traveler</label>
      <select name="best_time_to_call">
        <option value="">-- Select --</option>
        {% for v in best_times %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label>Time Zone</label>
      <select name="time_zone">
        <option value="">-- Select --</option>
        {% for v in time_zones %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
      </select>
    </div>
    <div class="full">
      <label>Attach Documents</label>
      <input type="file" name="attachments" multiple>
    </div>
  </div>

  <p style="margin-top:20px;">
    <button class="btn" type="submit">Create Escalation</button>
  </p>
</form>

<script>
const SUBTYPES_BY_TYPE = {{ subtypes_by_type|tojson }};
const CLINICAL_TYPES = {{ clinical_types|tojson }};
const typeField = document.getElementById('typeField');
const subtypeWrapper = document.getElementById('subtypeWrapper');
const subtypeField = document.getElementById('subtypeField');
const complianceField = document.getElementById('complianceField');
const complianceRequiredMark = document.getElementById('complianceRequiredMark');
const payrollSpecialistWrapper = document.getElementById('payrollSpecialistWrapper');
const clinicalLiaisonWrapper = document.getElementById('clinicalLiaisonWrapper');

function syncSubtype() {
  const type = typeField.value;
  const isClinical = CLINICAL_TYPES.includes(type);
  const isPayroll = type === 'Payroll & Timekeeping';

  if (isClinical) {
    subtypeWrapper.style.display = '';
    subtypeField.required = true;
    const options = SUBTYPES_BY_TYPE[type] || [];
    subtypeField.innerHTML = '<option value="">-- Select --</option>' + options.map(o => `<option value="${o}">${o}</option>`).join('');
  } else {
    subtypeWrapper.style.display = 'none';
    subtypeField.required = false;
    subtypeField.innerHTML = '<option value=""></option>';
  }

  // Compliance Specialist is not required for Clinical - Traveler/Client Initiated
  // or Payroll & Timekeeping escalations.
  const complianceNotRequired = isClinical || isPayroll;
  complianceField.required = !complianceNotRequired;
  complianceRequiredMark.style.display = complianceNotRequired ? 'none' : '';

  // Payroll Specialist field only shown for Payroll & Timekeeping (never required)
  payrollSpecialistWrapper.style.display = isPayroll ? '' : 'none';

  // Clinical Liaison field only shown for Clinical types
  clinicalLiaisonWrapper.style.display = isClinical ? '' : 'none';
}
typeField.addEventListener('change', syncSubtype);
syncSubtype();

// --- Rich text editor (contenteditable) sync for Details/What Happened ---
// Bullet lists and paragraph breaks pasted from Word/Docs/etc. are preserved
// by the browser's native contenteditable paste handling; we just need to
// keep the hidden textarea (the field actually submitted/validated) in sync.
const detailsEditor = document.getElementById('detailsEditor');
const detailsHidden = document.getElementById('detailsHidden');
const detailsForm = detailsEditor.closest('form');

function syncDetailsHidden() {
  detailsHidden.value = detailsEditor.innerHTML.trim();
}
detailsEditor.addEventListener('input', syncDetailsHidden);
detailsEditor.addEventListener('blur', syncDetailsHidden);
detailsForm.addEventListener('submit', syncDetailsHidden);
</script>
{% endblock %}

{% extends "base.html" %}
{% import "_brand_icon.html" as icon %}
{% block title %}Set Your Password{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto;">
  <div style="width:56px;height:56px;margin:0 auto 12px;">{{ icon.brand_icon() }}</div>
  <h1 style="text-align:center;">Set Your Password</h1>
  <p style="text-align:center;color:var(--brand-gray);">Choose a password to access the TOA Escalations Portal.</p>
  <form method="post">
    <label>New Password</label>
    <input type="password" name="password" required minlength="8">
    <br><br>
    <label>Confirm Password</label>
    <input type="password" name="confirm_password" required minlength="8">
    <br><br>
    <button class="btn" style="width:100%;" type="submit">Set Password</button>
  </form>
</div>
{% endblock %}

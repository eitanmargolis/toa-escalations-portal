{% extends "base.html" %}
{% import "_brand_icon.html" as icon %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto;">
  <div style="width:56px;height:56px;margin:0 auto 12px;">{{ icon.brand_icon() }}</div>
  <h1 style="text-align:center;">COAST MEDICAL SERVICE</h1>
  <p style="text-align:center;color:var(--brand-gray);">TOA Escalations Portal</p>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required>
    <br><br>
    <label>Password</label>
    <input type="password" name="password" required>
    <br><br>
    <button class="btn" style="width:100%;" type="submit">Log In</button>
  </form>
</div>
{% endblock %}

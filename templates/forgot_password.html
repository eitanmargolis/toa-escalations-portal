{% extends "base.html" %}
{% import "_brand_icon.html" as icon %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:60px auto;">
  <div style="width:56px;height:56px;margin:0 auto 12px;">{{ icon.brand_icon() }}</div>
  <h1 style="text-align:center;">Forgot Password</h1>
  <p style="text-align:center;color:var(--brand-gray);">Enter your email and we'll send you a link to reset your password.</p>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required>
    <br><br>
    <button class="btn" style="width:100%;" type="submit">Send Reset Link</button>
  </form>
  <p style="text-align:center;margin-top:14px;">
    <a href="{{ url_for('login') }}" style="color:var(--brand-blue);font-size:14px;">Back to log in</a>
  </p>
</div>
{% endblock %}
